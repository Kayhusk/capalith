name: Bug report
description: Something doesn't work, or an answer is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste API keys or private skill text. For a security problem use the Security tab instead, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you see, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The commands or the search you ran, in order. A short skill folder that shows it is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Capalith version
      description: Output of `capalith --version`
      placeholder: capalith 0.2.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and Python
      placeholder: Ubuntu 24.04, Python 3.11
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Your agent or client
      description: Claude Code, Codex, another MCP client, or the command line
  - type: textarea
    id: output
    attributes:
      label: Error text or output
      description: Paste exactly what was printed.
      render: text
